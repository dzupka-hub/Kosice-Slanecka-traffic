# Merania rychlosti na Slaneckej.
# Cron spusti beh raz za hodinu, sam beh potom podla dna a hodiny
# rozhodne, kolko vzoriek odmeria - v spicke 6 (kazdych 10 min), inak 1.

name: Meranie dopravy Slanecka

on:
  schedule:
    - cron: "0 3-20 * * 1-5"     # pracovne dni, kazdu hodinu (UTC)
    - cron: "0 4-18/2 * * 0,6"   # vikend, kazde 2 hodiny (UTC)
  workflow_dispatch:
    inputs:
      vzorky:
        description: "Pocet merani v tomto behu"
        default: "1"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Meraj a zapisuj
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          RUCNE: ${{ github.event.inputs.vzorky }}
        run: |
          set -u
          git config user.name "traffic-bot"
          git config user.email "actions@github.com"

          H=$(date -u +%-H)
          D=$(date -u +%u)

          if [ -n "${RUCNE:-}" ]; then
            VZORKY="$RUCNE"
          elif [ "$D" -le 5 ] && { [ "$H" -ge 3 ] && [ "$H" -le 7 ] || [ "$H" -ge 12 ] && [ "$H" -le 15 ]; }; then
            VZORKY=6
          else
            VZORKY=1
          fi

          echo "Hodina ${H} UTC, den ${D} -> ${VZORKY} vzoriek"

          for i in $(seq 1 "$VZORKY"); do
            echo "--- vzorka ${i}/${VZORKY} ---"
            node collect.js || echo "meranie zlyhalo, pokracujem"

            git add data/
            if ! git diff --cached --quiet; then
              git commit -m "meranie $(date -u +'%Y-%m-%d %H:%M') UTC"
              for pokus in 1 2 3; do
                git push && break
                git pull --rebase --autostash
              done
            fi

            if [ "$i" -lt "$VZORKY" ]; then sleep 600; fi
          done
